name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - working-directory: frontend
        run: npm install

      - working-directory: frontend
        run: npm run build

      - working-directory: frontend
        run: npm test -- --run
